name: Monitor GTranslate Translations

on:
  push:
  repository_dispatch:
    types: [gtranslate-monitor]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      AUTO_FIX_ENABLED: ${{ secrets.AUTO_FIX_ENABLED }}

    steps:
      - uses: actions/checkout@v4

      - name: Check translated URLs
        id: check
        shell: bash
        run: |
          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
          )

          FAILED=""

          for URL in "${URLS[@]}"; do
            echo "Checking $URL"
            BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)

            if echo "$BODY" | grep -qi "SSL handshake failed"; then
              FAILED="${FAILED} ${URL}"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "details=SSL handshake failed detected on translated URLs: $FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "details=No SSL handshake failed error detected." >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open incident
        id: issue_search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list \
            --state open \
            --label "gtranslate-monitor" \
            --json number \
            --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Auto-remediate GTranslate config by testing all nodes
        id: remediate
        if: steps.check.outputs.failed == 'true' && env.AUTO_FIX_ENABLED == 'true'
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          CONFIG_PATH: ${{ secrets.GTRANSLATE_CONFIG_PATH }}
          DOMAIN: ${{ secrets.GTRANSLATE_DOMAIN }}
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y lftp

          mkdir -p gtranslate-remediation

          echo "Downloading current config.php..."
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get $CONFIG_PATH -o gtranslate-remediation/config.before.php;
            bye
          "

          python3 << 'PY'
          import os
          import re
          import hashlib

          before_path = "gtranslate-remediation/config.before.php"
          domain = os.environ["DOMAIN"].lower().strip()
          domain = re.sub(r"^www\.", "", domain)

          content = open(before_path, "r", encoding="utf-8", errors="ignore").read()

          pattern = re.compile(r"(?m)^(\s*\$servers\s*=\s*array\s*\()(.*?)(\)\s*;)", re.DOTALL)
          match = pattern.search(content)

          if not match:
              raise SystemExit("Could not find active $servers array in config.php")

          array_body = match.group(2)
          servers = re.findall(r"'([^']+)'|\"([^\"]+)\"", array_body)
          servers = [a or b for a, b in servers]

          if len(servers) < 3:
              raise SystemExit("Refusing remediation because server list is too small")

          hash_prefix = hashlib.md5(domain.encode()).hexdigest()[:5]
          calculated_index = int(hash_prefix, 16) % len(servers)

          ordered_indices = list(range(calculated_index, len(servers))) + list(range(0, calculated_index))

          with open("gtranslate-remediation/attempts.tsv", "w", encoding="utf-8") as attempts_file:
              for attempt_number, idx in enumerate(ordered_indices, start=1):
                  node = servers[idx]
                  new_servers = [server for i, server in enumerate(servers) if i != idx]

                  if len(new_servers) < 2:
                      continue

                  new_array = "$servers = array(" + ", ".join([repr(s) for s in new_servers]) + ");"
                  new_content = content[:match.start()] + new_array + content[match.end():]

                  attempt_path = f"gtranslate-remediation/config.attempt{attempt_number}.php"
                  open(attempt_path, "w", encoding="utf-8").write(new_content)

                  updated_array_text = ",".join(new_servers)

                  attempts_file.write(
                      f"{attempt_number}\t{node}\t{idx}\t{attempt_path}\t{updated_array_text}\n"
                  )

          summary = (
              f"Domain={domain}; "
              f"OriginalNodes={','.join(servers)}; "
              f"CalculatedStartIndex={calculated_index}; "
              f"Strategy=Test every node one by one. Remove one node, upload config, re-check URLs. "
              f"If recovered, keep that config. If all attempts fail, restore original config."
          )

          open("gtranslate-remediation/summary.txt", "w", encoding="utf-8").write(summary)
          PY

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REMOTE_PATH="${CONFIG_PATH}.backup-${TIMESTAMP}"

          echo "Creating remote backup: $BACKUP_REMOTE_PATH"
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            put gtranslate-remediation/config.before.php -o $BACKUP_REMOTE_PATH;
            bye
          "

          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
          )

          RECOVERED="false"
          REMOVED_NODE=""
          REMOVED_INDEX=""
          ATTEMPTS_DONE="0"
          ATTEMPT_LOG=""
          FINAL_DETAILS="Auto-remediation started."
          BASE_SUMMARY="$(cat gtranslate-remediation/summary.txt)"

          while IFS=$'\t' read -r ATTEMPT NODE INDEX ATTEMPT_PATH UPDATED_ARRAY; do
            ATTEMPTS_DONE="$ATTEMPT"

            echo "Attempt $ATTEMPT: removing node '$NODE' at index $INDEX"

            lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
              set sftp:auto-confirm yes;
              put $ATTEMPT_PATH -o $CONFIG_PATH;
              bye
            "

            sleep 20

            FAILED=""

            for URL in "${URLS[@]}"; do
              echo "Re-checking $URL after attempt $ATTEMPT"
              BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)

              if echo "$BODY" | grep -qi "SSL handshake failed"; then
                FAILED="${FAILED} ${URL}"
              fi
            done

            if [ -z "$ATTEMPT_LOG" ]; then
              ATTEMPT_LOG="Attempt ${ATTEMPT}: removed ${NODE} at index ${INDEX}"
            else
              ATTEMPT_LOG="${ATTEMPT_LOG} | Attempt ${ATTEMPT}: removed ${NODE} at index ${INDEX}"
            fi

            if [ -z "$FAILED" ]; then
              RECOVERED="true"
              REMOVED_NODE="$NODE"
              REMOVED_INDEX="$INDEX"
              FINAL_DETAILS="Recovered after attempt ${ATTEMPT}. Removed node ${NODE} at index ${INDEX}. Backup created at ${BACKUP_REMOTE_PATH}."
              echo "$FINAL_DETAILS"
              break
            else
              echo "Still failing after attempt $ATTEMPT"
            fi
          done < gtranslate-remediation/attempts.tsv

          if [ "$RECOVERED" != "true" ]; then
            echo "All node-removal attempts failed. Restoring original config.php."

            lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
              set sftp:auto-confirm yes;
              put gtranslate-remediation/config.before.php -o $CONFIG_PATH;
              bye
            "

            FINAL_DETAILS="All node-removal attempts failed. Original config.php was restored. Backup created at ${BACKUP_REMOTE_PATH}."
          fi

          SUMMARY="${BASE_SUMMARY}; Backup=${BACKUP_REMOTE_PATH}; AttemptsDone=${ATTEMPTS_DONE}; Recovered=${RECOVERED}; RemovedNode=${REMOVED_NODE}; RemovedIndex=${REMOVED_INDEX}; AttemptLog=${ATTEMPT_LOG}; FinalDetails=${FINAL_DETAILS}"

          echo "recovered=${RECOVERED}" >> "$GITHUB_OUTPUT"
          echo "removed_node=${REMOVED_NODE}" >> "$GITHUB_OUTPUT"
          echo "removed_index=${REMOVED_INDEX}" >> "$GITHUB_OUTPUT"
          echo "attempts_done=${ATTEMPTS_DONE}" >> "$GITHUB_OUTPUT"
          echo "backup_path=${BACKUP_REMOTE_PATH}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "details=${FINAL_DETAILS}" >> "$GITHUB_OUTPUT"

      - name: Send alert and remediation email
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "ALERTA: GTranslate SSL handshake failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Se detectó el error "SSL handshake failed" en páginas traducidas de Visure Solutions.

            URLs afectadas:
            ${{ steps.check.outputs.details }}

            Resultado de auto-remediación:
            ${{ steps.remediate.outputs.details }}

            Resumen:
            ${{ steps.remediate.outputs.summary }}

            Backup remoto creado:
            ${{ steps.remediate.outputs.backup_path }}

            Nota:
            El workflow ya no envía el contenido completo de config.php por seguridad.

      - name: Create GitHub issue when incident starts and still failing
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0' && steps.remediate.outputs.recovered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "GTranslate SSL handshake failed detected" \
            --label "gtranslate-monitor" \
            --body "Automatic monitor detected SSL handshake failed in translated pages.

          URLs:
          ${{ steps.check.outputs.details }}

          Auto-remediation result:
          ${{ steps.remediate.outputs.details }}

          Summary:
          ${{ steps.remediate.outputs.summary }}

          Backup:
          ${{ steps.remediate.outputs.backup_path }}

          This issue will remain open until the error disappears."

      - name: Send recovery email after successful auto-remediation
        if: steps.check.outputs.failed == 'true' && steps.remediate.outputs.recovered == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación después de auto-remediación.

            Nodo removido:
            ${{ steps.remediate.outputs.removed_node }}

            Índice removido:
            ${{ steps.remediate.outputs.removed_index }}

            Intentos realizados:
            ${{ steps.remediate.outputs.attempts_done }}

            Backup remoto:
            ${{ steps.remediate.outputs.backup_path }}

            Detalles:
            ${{ steps.remediate.outputs.details }}

            El error "SSL handshake failed" ya no aparece en las páginas traducidas monitoreadas.

      - name: Close issue when recovered naturally
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUES=$(gh issue list --state open --label "gtranslate-monitor" --json number --jq '.[].number')
          for ISSUE in $ISSUES; do
            gh issue comment "$ISSUE" --body "Recovery detected. The SSL handshake failed error is no longer present."
            gh issue close "$ISSUE"
          done

      - name: Send recovery email when recovered naturally
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación.

            El error "SSL handshake failed" ya no aparece en las páginas traducidas monitoreadas.
