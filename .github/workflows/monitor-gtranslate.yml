name: Monitor GTranslate Translations

on:
  push:
  repository_dispatch:
    types: [gtranslate-monitor]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      AUTO_FIX_ENABLED: ${{ secrets.AUTO_FIX_ENABLED }}
      KNOWN_GOOD_SERVERS: "van,kars,sis,dvin,ani,evn,vagh,step,sis,tigr,ani,van"

    steps:
      - uses: actions/checkout@v4

      - name: Check translated URLs
        id: check
        shell: bash
        run: |
          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
            "https://visuresolutions.com/nl/"
          )

          FAILED=""

          for URL in "${URLS[@]}"; do
            echo "Checking $URL"
            BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)

            if echo "$BODY" | grep -qi "SSL handshake failed"; then
              FAILED="${FAILED} ${URL}"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "details=SSL handshake failed detected on: $FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "details=No SSL handshake failed error detected." >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open incident
        id: issue_search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list \
            --state open \
            --label "gtranslate-monitor" \
            --json number \
            --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Auto-remediate GTranslate config safely
        id: remediate
        if: steps.check.outputs.failed == 'true' && env.AUTO_FIX_ENABLED == 'true'
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          CONFIG_PATH: ${{ secrets.GTRANSLATE_CONFIG_PATH }}
          KNOWN_GOOD_SERVERS: ${{ env.KNOWN_GOOD_SERVERS }}
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y lftp

          mkdir -p gtranslate-remediation

          echo "Downloading current config.php..."
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get $CONFIG_PATH -o gtranslate-remediation/config.before.php;
            bye
          "

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REMOTE_PATH="${CONFIG_PATH}.backup-${TIMESTAMP}"

          echo "Creating remote backup: $BACKUP_REMOTE_PATH"
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            put gtranslate-remediation/config.before.php -o $BACKUP_REMOTE_PATH;
            bye
          "

          python3 << 'PY'
          import os
          import re

          before_path = "gtranslate-remediation/config.before.php"
          content = open(before_path, "r", encoding="utf-8", errors="ignore").read()

          pattern = re.compile(r"(?m)^(\s*\$servers\s*=\s*array\s*\()(.*?)(\)\s*;)", re.DOTALL)
          match = pattern.search(content)

          if not match:
              raise SystemExit("Could not find active $servers array in config.php")

          known_good = [x.strip() for x in os.environ["KNOWN_GOOD_SERVERS"].split(",") if x.strip()]

          def build_config(servers):
              new_array = "$servers = array(" + ", ".join([repr(s) for s in servers]) + ");"
              return content[:match.start()] + new_array + content[match.end():]

          open("gtranslate-remediation/config.known-good.php", "w", encoding="utf-8").write(build_config(known_good))

          with open("gtranslate-remediation/attempts.tsv", "w", encoding="utf-8") as f:
              for attempt, idx in enumerate(range(len(known_good)), start=1):
                  node = known_good[idx]
                  new_servers = [server for i, server in enumerate(known_good) if i != idx]
                  attempt_path = f"gtranslate-remediation/config.attempt{attempt}.php"
                  open(attempt_path, "w", encoding="utf-8").write(build_config(new_servers))
                  f.write(f"{attempt}\t{node}\t{idx}\t{attempt_path}\t{','.join(new_servers)}\n")
          PY

          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
            "https://visuresolutions.com/nl/"
          )

          test_urls() {
            FAILED_LOCAL=""
            for URL in "${URLS[@]}"; do
              echo "Testing $URL"
              BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)
              if echo "$BODY" | grep -qi "SSL handshake failed"; then
                FAILED_LOCAL="${FAILED_LOCAL} ${URL}"
              fi
            done

            if [ -z "$FAILED_LOCAL" ]; then
              return 0
            else
              return 1
            fi
          }

          RECOVERED="false"
          REMOVED_NODE=""
          REMOVED_INDEX=""
          ATTEMPTS_DONE="0"
          FINAL_DETAILS=""
          ATTEMPT_LOG=""

          echo "Step 1: restoring known-good original server array first."
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            put gtranslate-remediation/config.known-good.php -o $CONFIG_PATH;
            bye
          "

          sleep 20

          if test_urls; then
            RECOVERED="true"
            FINAL_DETAILS="Recovered by restoring the original known-good GTranslate server array. No node was removed. Backup: ${BACKUP_REMOTE_PATH}."
          else
            echo "Known-good reset did not recover. Testing node removals one by one."

            while IFS=$'\t' read -r ATTEMPT NODE INDEX ATTEMPT_PATH UPDATED_ARRAY; do
              ATTEMPTS_DONE="$ATTEMPT"
              echo "Attempt $ATTEMPT: removing node '$NODE' at index $INDEX"

              lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
                set sftp:auto-confirm yes;
                put $ATTEMPT_PATH -o $CONFIG_PATH;
                bye
              "

              sleep 20

              if [ -z "$ATTEMPT_LOG" ]; then
                ATTEMPT_LOG="Attempt ${ATTEMPT}: removed ${NODE} at index ${INDEX}"
              else
                ATTEMPT_LOG="${ATTEMPT_LOG} | Attempt ${ATTEMPT}: removed ${NODE} at index ${INDEX}"
              fi

              if test_urls; then
                RECOVERED="true"
                REMOVED_NODE="$NODE"
                REMOVED_INDEX="$INDEX"
                FINAL_DETAILS="Recovered after attempt ${ATTEMPT}. Removed node ${NODE} at index ${INDEX}. Backup: ${BACKUP_REMOTE_PATH}."
                break
              fi
            done < gtranslate-remediation/attempts.tsv
          fi

          if [ "$RECOVERED" != "true" ]; then
            echo "All attempts failed. Restoring known-good original server array."

            lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
              set sftp:auto-confirm yes;
              put gtranslate-remediation/config.known-good.php -o $CONFIG_PATH;
              bye
            "

            FINAL_DETAILS="All attempts failed. Restored original known-good server array. Backup: ${BACKUP_REMOTE_PATH}."
          fi

          SUMMARY="Recovered=${RECOVERED}; RemovedNode=${REMOVED_NODE}; RemovedIndex=${REMOVED_INDEX}; AttemptsDone=${ATTEMPTS_DONE}; Backup=${BACKUP_REMOTE_PATH}; AttemptLog=${ATTEMPT_LOG}; Details=${FINAL_DETAILS}"

          echo "recovered=${RECOVERED}" >> "$GITHUB_OUTPUT"
          echo "removed_node=${REMOVED_NODE}" >> "$GITHUB_OUTPUT"
          echo "removed_index=${REMOVED_INDEX}" >> "$GITHUB_OUTPUT"
          echo "attempts_done=${ATTEMPTS_DONE}" >> "$GITHUB_OUTPUT"
          echo "backup_path=${BACKUP_REMOTE_PATH}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "details=${FINAL_DETAILS}" >> "$GITHUB_OUTPUT"

      - name: Send alert and remediation email
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "ALERTA: GTranslate SSL handshake failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Se detectó el error "SSL handshake failed" en páginas traducidas de Visure Solutions.

            URLs afectadas:
            ${{ steps.check.outputs.details }}

            Resultado de auto-remediación:
            ${{ steps.remediate.outputs.details }}

            Resumen:
            ${{ steps.remediate.outputs.summary }}

            Backup remoto:
            ${{ steps.remediate.outputs.backup_path }}

      - name: Create GitHub issue when incident starts and still failing
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0' && steps.remediate.outputs.recovered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "GTranslate SSL handshake failed detected" \
            --label "gtranslate-monitor" \
            --body "Automatic monitor detected SSL handshake failed.

          URLs:
          ${{ steps.check.outputs.details }}

          Auto-remediation:
          ${{ steps.remediate.outputs.details }}

          Summary:
          ${{ steps.remediate.outputs.summary }}

          Backup:
          ${{ steps.remediate.outputs.backup_path }}"

      - name: Send recovery email after successful auto-remediation
        if: steps.check.outputs.failed == 'true' && steps.remediate.outputs.recovered == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación después de auto-remediación.

            Nodo removido:
            ${{ steps.remediate.outputs.removed_node }}

            Índice removido:
            ${{ steps.remediate.outputs.removed_index }}

            Intentos realizados:
            ${{ steps.remediate.outputs.attempts_done }}

            Backup remoto:
            ${{ steps.remediate.outputs.backup_path }}

            Detalles:
            ${{ steps.remediate.outputs.details }}

      - name: Close issue when recovered naturally
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUES=$(gh issue list --state open --label "gtranslate-monitor" --json number --jq '.[].number')
          for ISSUE in $ISSUES; do
            gh issue comment "$ISSUE" --body "Recovery detected. The SSL handshake failed error is no longer present."
            gh issue close "$ISSUE"
          done

      - name: Send recovery email when recovered naturally
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación.

            El error "SSL handshake failed" ya no aparece en las páginas traducidas monitoreadas.
