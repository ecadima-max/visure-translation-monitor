name: Monitor GTranslate Translations

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check translated URLs
        id: check
        shell: bash
        run: |
          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
          )

          FAILED=""

          for URL in "${URLS[@]}"; do
            echo "Checking $URL"

            BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)

            if echo "$BODY" | grep -qi "SSL handshake failed"; then
              FAILED="${FAILED}\n- ${URL}: SSL handshake failed"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$FAILED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open incident
        id: issue_search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list \
            --state open \
            --label "gtranslate-monitor" \
            --json number \
            --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Send alert email when incident starts
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "ALERTA: GTranslate SSL handshake failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Se detectó el error "SSL handshake failed" en páginas traducidas de Visure Solutions.

            URLs afectadas:
            ${{ steps.check.outputs.details }}

            El monitor corre cada 5 minutos.
            No se enviarán emails repetidos mientras el incidente siga abierto.

      - name: Create GitHub issue when incident starts
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "GTranslate SSL handshake failed detected" \
            --label "gtranslate-monitor" \
            --body "Automatic monitor detected SSL handshake failed in translated pages:

          ${{ steps.check.outputs.details }}

          This issue will remain open until the error disappears."

      - name: Close issue when recovered
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUES=$(gh issue list --state open --label "gtranslate-monitor" --json number --jq '.[].number')
          for ISSUE in $ISSUES; do
            gh issue comment "$ISSUE" --body "Recovery detected. The SSL handshake failed error is no longer present."
            gh issue close "$ISSUE"
          done

      - name: Send recovery email
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación.

            El error "SSL handshake failed" ya no aparece en las páginas traducidas monitoreadas.
