name: Monitor GTranslate Translations

on:
  push:
  repository_dispatch:
    types: [gtranslate-monitor]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check translated URLs
        id: check
        shell: bash
        run: |
          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
          )

          FAILED=""

          for URL in "${URLS[@]}"; do
            echo "Checking $URL"
            BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)

            if echo "$BODY" | grep -qi "SSL handshake failed"; then
              FAILED="${FAILED}\n- ${URL}: SSL handshake failed"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$FAILED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open incident
        id: issue_search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list \
            --state open \
            --label "gtranslate-monitor" \
            --json number \
            --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Auto-remediate GTranslate config
        id: remediate
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0' && secrets.AUTO_FIX_ENABLED == 'true'
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          CONFIG_PATH: ${{ secrets.GTRANSLATE_CONFIG_PATH }}
          DOMAIN: ${{ secrets.GTRANSLATE_DOMAIN }}
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y lftp

          mkdir -p gtranslate-remediation

          echo "Downloading current config.php..."
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get $CONFIG_PATH -o gtranslate-remediation/config.before.php;
            bye
          "

          python3 << 'PY'
          import os, re, hashlib

          before_path = "gtranslate-remediation/config.before.php"
          after_path = "gtranslate-remediation/config.after.php"
          summary_path = "gtranslate-remediation/summary.txt"

          domain = os.environ["DOMAIN"].lower().strip()
          domain = re.sub(r"^www\.", "", domain)

          content = open(before_path, "r", encoding="utf-8", errors="ignore").read()

          pattern = re.compile(r"(?m)^(\s*\$servers\s*=\s*array\s*\()(.*?)(\)\s*;)", re.DOTALL)
          match = pattern.search(content)

          if not match:
              raise SystemExit("Could not find active $servers array in config.php")

          array_body = match.group(2)
          servers = re.findall(r"'([^']+)'|\"([^\"]+)\"", array_body)
          servers = [a or b for a, b in servers]

          if not servers:
              raise SystemExit("Could not parse server list")

          hash_prefix = hashlib.md5(domain.encode()).hexdigest()[:5]
          server_id = int(hash_prefix, 16) % len(servers)
          bad_node = servers[server_id]

          new_servers = servers[:server_id] + servers[server_id+1:]

          if len(new_servers) < 2:
              raise SystemExit("Refusing to remove node because server list would become too small")

          new_array = "$servers = array(" + ", ".join([repr(s) for s in new_servers]) + ");"

          new_content = content[:match.start()] + new_array + content[match.end():]

          open(after_path, "w", encoding="utf-8").write(new_content)

          summary = (
              "GTranslate auto-remediation executed.\n\n"
              f"Domain:\n{domain}\n\n"
              f"Detected active server index:\n{server_id}\n\n"
              f"Detected problematic node:\n{bad_node}\n\n"
              f"Original server array:\n{servers}\n\n"
              f"Updated server array:\n{new_servers}\n"
          )
          
          open(summary_path, "w", encoding="utf-8").write(summary)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"node={bad_node}\n")
              out.write(f"server_id={server_id}\n")
              out.write("summary<<EOF\n")
              out.write(summary)
              out.write("\nEOF\n")
          PY

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

          echo "Uploading backup and modified config.php..."
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            put gtranslate-remediation/config.before.php -o ${CONFIG_PATH}.backup-${TIMESTAMP};
            put gtranslate-remediation/config.after.php -o $CONFIG_PATH;
            bye
          "

          echo "before_config<<EOF" >> "$GITHUB_OUTPUT"
          cat gtranslate-remediation/config.before.php >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Re-check translated URLs after remediation
        id: recheck
        if: steps.remediate.outputs.node != ''
        shell: bash
        run: |
          sleep 20

          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
          )

          FAILED=""

          for URL in "${URLS[@]}"; do
            echo "Re-checking $URL"
            BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)

            if echo "$BODY" | grep -qi "SSL handshake failed"; then
              FAILED="${FAILED}\n- ${URL}: SSL handshake failed"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$FAILED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send alert and remediation email
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "ALERTA: GTranslate SSL handshake failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Se detectó el error "SSL handshake failed" en páginas traducidas de Visure Solutions.

            URLs afectadas:
            ${{ steps.check.outputs.details }}

            Auto-remediación:
            ${{ steps.remediate.outputs.summary }}

            Resultado del re-check después de modificar config.php:
            recovered=${{ steps.recheck.outputs.recovered }}

            Si recovered=true, el nodo conflictivo fue removido correctamente.
            Si recovered=false, todavía quedan URLs afectadas:
            ${{ steps.recheck.outputs.details }}

            Config.php ANTES de la modificación:
            ${{ steps.remediate.outputs.before_config }}

      - name: Create GitHub issue when incident starts and still failing
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0' && steps.recheck.outputs.recovered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "GTranslate SSL handshake failed detected" \
            --label "gtranslate-monitor" \
            --body "Automatic monitor detected SSL handshake failed in translated pages:

          ${{ steps.check.outputs.details }}

          Auto-remediation was attempted.

          ${{ steps.remediate.outputs.summary }}

          Re-check result:
          ${{ steps.recheck.outputs.details }}

          This issue will remain open until the error disappears."

      - name: Send recovery email after successful auto-remediation
        if: steps.check.outputs.failed == 'true' && steps.recheck.outputs.recovered == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación después de auto-remediación.

            Nodo removido:
            ${{ steps.remediate.outputs.node }}

            Detalles:
            ${{ steps.remediate.outputs.summary }}

            El error "SSL handshake failed" ya no aparece en las páginas traducidas monitoreadas.

      - name: Close issue when recovered naturally
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUES=$(gh issue list --state open --label "gtranslate-monitor" --json number --jq '.[].number')
          for ISSUE in $ISSUES; do
            gh issue comment "$ISSUE" --body "Recovery detected. The SSL handshake failed error is no longer present."
            gh issue close "$ISSUE"
          done

      - name: Send recovery email when recovered naturally
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación.

            El error "SSL handshake failed" ya no aparece en las páginas traducidas monitoreadas.
