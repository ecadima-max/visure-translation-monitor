name: Monitor GTranslate Translations

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check translated URLs
        id: check
        shell: bash
        run: |
          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
          )

          REQUIRED_TEXT="Visure Solutions"
          FAILED=""

          for URL in "${URLS[@]}"; do
            echo "Checking $URL"

            BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 15 --connect-timeout 8 "$URL" || echo "000")

            if [ "$STATUS" != "200" ]; then
              FAILED="${FAILED}\n- ${URL}: HTTP ${STATUS}"
            elif echo "$BODY" | grep -qi "SSL handshake failed"; then
              FAILED="${FAILED}\n- ${URL}: SSL handshake failed"
            elif echo "$BODY" | grep -qi "GTranslate - Translation Proxy"; then
              FAILED="${FAILED}\n- ${URL}: GTranslate proxy error"
            elif echo "$BODY" | grep -qi "An error occurred"; then
              FAILED="${FAILED}\n- ${URL}: generic error page detected"
            elif ! echo "$BODY" | grep -qi "$REQUIRED_TEXT"; then
              FAILED="${FAILED}\n- ${URL}: required text not found"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$FAILED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open incident
        id: issue_search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list \
            --state open \
            --label "gtranslate-monitor" \
            --json number \
            --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create issue and send email when incident starts
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "ALERTA: GTranslate fallando en Visure Solutions"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Se detectó un problema en las páginas traducidas de Visure Solutions.

            Detalles:
            ${{ steps.check.outputs.details }}

            El monitor corre cada 5 minutos.
            No se enviarán emails repetidos mientras el incidente siga abierto.

      - name: Create GitHub issue when incident starts
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "GTranslate translation failure detected" \
            --label "gtranslate-monitor" \
            --body "Automatic monitor detected translation failures:

          ${{ steps.check.outputs.details }}

          Possible causes:
          - GTranslate proxy issue
          - SSL handshake problem
          - CDN/WAF blocking
          - Hostinger temporary availability issue

          This issue will remain open until the translated URLs recover."

      - name: Close issue and send recovery email
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUES=$(gh issue list --state open --label "gtranslate-monitor" --json number --jq '.[].number')
          for ISSUE in $ISSUES; do
            gh issue comment "$ISSUE" --body "Recovery detected. All monitored translated URLs are working again."
            gh issue close "$ISSUE"
          done

      - name: Send recovery email
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate funcionando otra vez"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación.

            Todas las URLs traducidas monitoreadas están funcionando nuevamente.
