name: Monitor GTranslate Translations

on:
  push:
  repository_dispatch:
    types: [gtranslate-monitor]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      AUTO_FIX_ENABLED: ${{ secrets.AUTO_FIX_ENABLED }}

    steps:
      - uses: actions/checkout@v4

      - name: Check translated URLs
        id: check
        shell: bash
        run: |
          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
          )

          FAILED=""

          for URL in "${URLS[@]}"; do
            echo "Checking $URL"
            BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)

            if echo "$BODY" | grep -qi "SSL handshake failed"; then
              FAILED="${FAILED}\n- ${URL}: SSL handshake failed"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$FAILED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open incident
        id: issue_search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list \
            --state open \
            --label "gtranslate-monitor" \
            --json number \
            --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Auto-remediate GTranslate config with up to 3 attempts
        id: remediate
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0' && env.AUTO_FIX_ENABLED == 'true'
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          CONFIG_PATH: ${{ secrets.GTRANSLATE_CONFIG_PATH }}
          DOMAIN: ${{ secrets.GTRANSLATE_DOMAIN }}
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y lftp

          mkdir -p gtranslate-remediation

          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get $CONFIG_PATH -o gtranslate-remediation/config.before.php;
            bye
          "

          python3 << 'PY'
          import os, re, hashlib

          before_path = "gtranslate-remediation/config.before.php"
          domain = os.environ["DOMAIN"].lower().strip()
          domain = re.sub(r"^www\.", "", domain)

          content = open(before_path, "r", encoding="utf-8", errors="ignore").read()

          pattern = re.compile(r"(?m)^(\s*\$servers\s*=\s*array\s*\()(.*?)(\)\s*;)", re.DOTALL)
          match = pattern.search(content)

          if not match:
              raise SystemExit("Could not find active $servers array in config.php")

          array_body = match.group(2)
          servers = re.findall(r"'([^']+)'|\"([^\"]+)\"", array_body)
          servers = [a or b for a, b in servers]

          if not servers:
              raise SystemExit("Could not parse server list")

          hash_prefix = hashlib.md5(domain.encode()).hexdigest()[:5]
          calculated_index = int(hash_prefix, 16) % len(servers)

          attempts = []
          removed_indices = []

          max_attempts = min(3, len(servers) - 2)

          for attempt in range(1, max_attempts + 1):
              idx = (calculated_index + attempt - 1) % len(servers)

              if idx in removed_indices:
                  continue

              removed_indices.append(idx)

              new_servers = [
                  server for i, server in enumerate(servers)
                  if i not in removed_indices
              ]

              if len(new_servers) < 2:
                  raise SystemExit("Refusing to remove nodes because server list would become too small")

              new_array = "$servers = array(" + ", ".join([repr(s) for s in new_servers]) + ");"
              new_content = content[:match.start()] + new_array + content[match.end():]

              attempt_path = f"gtranslate-remediation/config.attempt{attempt}.php"
              open(attempt_path, "w", encoding="utf-8").write(new_content)

              attempts.append({
                  "attempt": attempt,
                  "removed_node": servers[idx],
                  "removed_index": idx,
                  "updated_servers": new_servers,
                  "attempt_path": attempt_path
              })

          with open("gtranslate-remediation/attempts.tsv", "w", encoding="utf-8") as f:
              for item in attempts:
                  f.write(
                      f"{item['attempt']}\t"
                      f"{item['removed_node']}\t"
                      f"{item['removed_index']}\t"
                      f"{item['attempt_path']}\t"
                      f"{item['updated_servers']}\n"
                  )

          summary = (
              "GTranslate auto-remediation prepared.\n\n"
              f"Domain:\n{domain}\n\n"
              f"Calculated starting server index:\n{calculated_index}\n\n"
              f"Original server array:\n{servers}\n\n"
              "Remediation strategy:\n"
              "Attempt #1 removes the calculated node.\n"
              "Attempt #2 additionally removes the next node if still failing.\n"
              "Attempt #3 additionally removes the next node if still failing.\n"
          )

          open("gtranslate-remediation/summary.txt", "w", encoding="utf-8").write(summary)
          PY

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            put gtranslate-remediation/config.before.php -o ${CONFIG_PATH}.backup-${TIMESTAMP};
            bye
          "

          URLS=(
            "https://visuresolutions.com/de/"
            "https://visuresolutions.com/fr/"
            "https://visuresolutions.com/es/"
            "https://visuresolutions.com/it/"
          )

          RECOVERED="false"
          FINAL_DETAILS=""
          REMOVED_NODES=""
          FINAL_SUMMARY="$(cat gtranslate-remediation/summary.txt)"

          while IFS=$'\t' read -r ATTEMPT NODE INDEX ATTEMPT_PATH UPDATED_ARRAY; do
            echo "Attempt $ATTEMPT: removing node $NODE at index $INDEX"

            lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
              set sftp:auto-confirm yes;
              put $ATTEMPT_PATH -o $CONFIG_PATH;
              bye
            "

            sleep 20

            FAILED=""

            for URL in "${URLS[@]}"; do
              echo "Re-checking $URL after attempt $ATTEMPT"
              BODY=$(curl -L -s --max-time 15 --connect-timeout 8 "$URL" || true)

              if echo "$BODY" | grep -qi "SSL handshake failed"; then
                FAILED="${FAILED}\n- ${URL}: SSL handshake failed"
              fi
            done

            if [ -z "$REMOVED_NODES" ]; then
              REMOVED_NODES="$NODE"
            else
              REMOVED_NODES="$REMOVED_NODES, $NODE"
            fi

            FINAL_SUMMARY="${FINAL_SUMMARY}\n\nAttempt #${ATTEMPT}\nRemoved node: ${NODE}\nRemoved index: ${INDEX}\nUpdated server array: ${UPDATED_ARRAY}\n"

            if [ -z "$FAILED" ]; then
              RECOVERED="true"
              FINAL_DETAILS="Recovered after attempt #${ATTEMPT}. Removed nodes: ${REMOVED_NODES}"
              FINAL_SUMMARY="${FINAL_SUMMARY}\n\nResult:\nRecovered after attempt #${ATTEMPT}.\n"
              break
            else
              FINAL_DETAILS="$FAILED"
              FINAL_SUMMARY="${FINAL_SUMMARY}\n\nResult:\nStill failing after attempt #${ATTEMPT}.\n"
            fi
          done < gtranslate-remediation/attempts.tsv

          if [ "$RECOVERED" != "true" ]; then
            echo "All remediation attempts failed. Restoring original config.php."

            lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_HOST":"$SFTP_PORT" -e "
              set sftp:auto-confirm yes;
              put gtranslate-remediation/config.before.php -o $CONFIG_PATH;
              bye
            "

            FINAL_SUMMARY="${FINAL_SUMMARY}\n\nFinal result:\nAll 3 attempts failed. Original config.php was restored.\n"
          fi

          echo "recovered=$RECOVERED" >> "$GITHUB_OUTPUT"
          echo "removed_nodes=$REMOVED_NODES" >> "$GITHUB_OUTPUT"

          echo "details<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$FINAL_DETAILS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$FINAL_SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "before_config<<EOF" >> "$GITHUB_OUTPUT"
          cat gtranslate-remediation/config.before.php >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send alert and remediation email
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "ALERTA: GTranslate SSL handshake failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Se detectó el error "SSL handshake failed" en páginas traducidas de Visure Solutions.

            URLs afectadas:
            ${{ steps.check.outputs.details }}

            Auto-remediación:
            ${{ steps.remediate.outputs.summary }}

            Resultado:
            recovered=${{ steps.remediate.outputs.recovered }}

            Nodos removidos:
            ${{ steps.remediate.outputs.removed_nodes }}

            Detalles:
            ${{ steps.remediate.outputs.details }}

            Config.php ANTES de la modificación:
            ${{ steps.remediate.outputs.before_config }}

      - name: Create GitHub issue when incident starts and still failing
        if: steps.check.outputs.failed == 'true' && steps.issue_search.outputs.count == '0' && steps.remediate.outputs.recovered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "GTranslate SSL handshake failed detected" \
            --label "gtranslate-monitor" \
            --body "Automatic monitor detected SSL handshake failed in translated pages:

          ${{ steps.check.outputs.details }}

          Auto-remediation was attempted:

          ${{ steps.remediate.outputs.summary }}

          Re-check result:

          ${{ steps.remediate.outputs.details }}

          This issue will remain open until the error disappears."

      - name: Send recovery email after successful auto-remediation
        if: steps.check.outputs.failed == 'true' && steps.remediate.outputs.recovered == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación después de auto-remediación.

            Nodos removidos:
            ${{ steps.remediate.outputs.removed_nodes }}

            Detalles:
            ${{ steps.remediate.outputs.summary }}

            El error "SSL handshake failed" ya no aparece.

      - name: Close issue when recovered naturally
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUES=$(gh issue list --state open --label "gtranslate-monitor" --json number --jq '.[].number')
          for ISSUE in $ISSUES; do
            gh issue comment "$ISSUE" --body "Recovery detected. The SSL handshake failed error is no longer present."
            gh issue close "$ISSUE"
          done

      - name: Send recovery email when recovered naturally
        if: steps.check.outputs.failed == 'false' && steps.issue_search.outputs.count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "RECUPERADO: GTranslate SSL handshake failed solucionado"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            El monitor detectó recuperación.

            El error "SSL handshake failed" ya no aparece en las páginas traducidas monitoreadas.
